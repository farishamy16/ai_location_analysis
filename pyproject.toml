[project]
name = "ai-location-analysis"
version = "0.1.0"
description = "AI-powered complaint location analyzer using OpenRouter LLM and Distance Matrix API"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.2.6",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]